name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Com CI=true, testes com PostgreSQL real sem Docker falham em vez de pular (ExigeDocker).
      CI: true
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar projeto
        run: ./mvnw -B verify
      - name: Conferir testes com PostgreSQL real
        # Segunda trava: os relatórios do surefire precisam mostrar os testes do
        # pacote postgres rodando, nenhum pulado.
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          rodados = pulados = 0
          for arquivo in glob.glob("target/surefire-reports/TEST-br.com.lac.caixa.postgres.Postgres*.xml"):
              suite = ET.parse(arquivo).getroot()
              rodados += int(suite.get("tests")) - int(suite.get("skipped"))
              pulados += int(suite.get("skipped"))
          linha = f"Testes com PostgreSQL real: {rodados} rodaram, {pulados} pulados."
          print(linha)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as resumo:
              resumo.write(linha + "\n")
          if rodados == 0 or pulados > 0:
              sys.exit("Os testes com PostgreSQL real não rodaram por completo.")
          PY
