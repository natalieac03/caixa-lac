# Producao (Railway). Os valores vem das variaveis de ambiente.
# Veja o README para como liga-las ao Postgres do Railway.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Obrigatoria: sem APP_SENHA a aplicacao nao sobe.
app.senha=${APP_SENHA}

# O Railway entrega as requisicoes por um proxy. Com "native", o Tomcat usa o
# X-Forwarded-For apenas quando a conexao vem de um proxy interno (rede
# privada), entao o limite de login conta o IP real de cada pessoa em vez de
# bloquear todo mundo pelo IP do proxy. Cabecalho vindo direto da internet e
# ignorado.
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
