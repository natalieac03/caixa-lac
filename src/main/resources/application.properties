spring.application.name=caixa-lac

# Railway define a porta na variavel PORT. Local cai em 8080.
server.port=${PORT:8080}

# Perfil ativo: "local" por padrao, "prod" no Railway.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Flyway é responsável pelo DDL; Hibernate apenas confere o modelo.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# As consultas carregam explicitamente os dados usados pelas telas.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Sessao so por cookie. Por padrao o Tomcat tambem rastreia a sessao pela URL:
# no primeiro login (navegador ainda sem cookie) ele reescrevia o redirect para
# "/;jsessionid=...", que dava 404 e mostrava a tela de erro (com o emoji 🦫 no
# lugar da logo) ate a pessoa voltar para uma URL limpa. Tambem evita vazar o id
# da sessao em links e historico do navegador.
server.servlet.session.tracking-modes=cookie

# Senha de acesso a interface, em TODOS os perfis, sem valor padrao.
# Ausente, vazia ou com menos de 8 caracteres: a aplicacao nao sobe
# (SenhaDeAcesso). No Railway fica em Variables; localmente, veja o README.
app.senha=${APP_SENHA}

# Estaticos (css, imagens) com cache de um ano no navegador. Para uma versao
# nova chegar na hora, a URL leva o hash do conteudo (/css/estilo-<hash>.css),
# montada pelo @{...} do Thymeleaf: mudou o arquivo, mudou a URL.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Coleções preguiçosas (ex.: pagamentos das vendas do histórico) carregadas em
# lotes de até 100 vendas por consulta, em vez de uma consulta por venda.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
