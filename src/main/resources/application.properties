# Configuração comum a todos os perfis: banco, Flyway, sessão, estáticos, actuator e Mercado Pago.
spring.application.name=caixa-lac

server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-{vendor}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=12h

app.senha=${APP_SENHA}

spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

spring.jpa.properties.hibernate.default_batch_fetch_size=100

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.endpoints.web.discovery.enabled=false

mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.payer-email=${MP_PAYER_EMAIL:}
mercadopago.payer-first-name=${MP_PAYER_NOME:${MP_PAYER_FIRST_NAME:}}
