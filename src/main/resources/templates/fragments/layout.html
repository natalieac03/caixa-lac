<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f2fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#140e1f" media="(prefers-color-scheme: dark)">
    <title th:text="${titulo} + ' · Caixa LAC'">Caixa LAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=JetBrains+Mono:wght@500;600&family=Nunito+Sans:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script th:inline="none">
        /* Tema claro/escuro: aplica a escolha salva antes de desenhar a página (sem piscar). */
        (function () {
            try {
                var t = localStorage.getItem('lac-tema');
                if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
            } catch (e) {}
        })();
        /* Menu Finanças: fecha ao clicar fora ou com Esc. */
        document.addEventListener('click', function (e) {
            document.querySelectorAll('details.menu-grupo[open]').forEach(function (d) {
                if (!d.contains(e.target)) d.removeAttribute('open');
            });
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            document.querySelectorAll('details.menu-grupo[open]').forEach(function (d) {
                d.removeAttribute('open');
                d.querySelector('summary').focus();
            });
        });
        function alternarTema() {
            var raiz = document.documentElement;
            var atual = raiz.getAttribute('data-tema')
                || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
            var novo = atual === 'escuro' ? 'claro' : 'escuro';
            raiz.setAttribute('data-tema', novo);
            try { localStorage.setItem('lac-tema', novo); } catch (e) {}
        }
    </script>
</head>
<body>

<!--/* Barra superior. Ícones: Lucide, desenhados inline com currentColor. */-->
<nav th:fragment="nav(ativo)" class="topo" aria-label="Navegação principal">
    <div class="topo-interno">
        <a class="marca" th:href="@{/}">Caixa LAC</a>
        <button th:replace="~{fragments/layout :: tema}"></button>
        <div class="nav-links">
            <a th:href="@{/caixa}" th:classappend="${ativo == 'caixa'} ? 'ativo'"
               th:attr="aria-current=${ativo == 'caixa'} ? 'page' : null">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
                Abrir caixa
            </a>
            <a th:href="@{/estoque}" th:classappend="${ativo == 'estoque'} ? 'ativo'"
               th:attr="aria-current=${ativo == 'estoque'} ? 'page' : null">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
                Estoque
            </a>
            <a th:href="@{/descontos}" th:classappend="${ativo == 'descontos'} ? 'ativo'"
               th:attr="aria-current=${ativo == 'descontos'} ? 'page' : null">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.6 21 11a2 2 0 0 1 0 2.8l-7.2 7.2a2 2 0 0 1-2.8 0L2.6 12.6A2 2 0 0 1 2 11.2V4a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.6Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
                Descontos
            </a>
            <a th:href="@{/historico}" th:classappend="${ativo == 'historico'} ? 'ativo'"
               th:attr="aria-current=${ativo == 'historico'} ? 'page' : null">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                Histórico
            </a>
            <a th:href="@{/fechamento}" th:classappend="${ativo == 'fechamento'} ? 'ativo'"
               th:attr="aria-current=${ativo == 'fechamento'} ? 'page' : null">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
                Fechamento
            </a>
            <!--/* Finanças agrupa o painel, eventos, despesas e taxas (details: abre sem JavaScript). */-->
            <details class="menu-grupo" th:with="noGrupo=${ativo == 'financas' or ativo == 'eventos' or ativo == 'despesas' or ativo == 'taxas'}">
                <summary th:classappend="${noGrupo} ? 'ativo'">
                    <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
                    Finanças
                    <svg class="icone seta-menu" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="menu-grupo-itens">
                    <a th:href="@{/financas}" th:classappend="${ativo == 'financas'} ? 'ativo'"
                       th:attr="aria-current=${ativo == 'financas'} ? 'page' : null">Painel de finanças</a>
                    <a th:href="@{/eventos}" th:classappend="${ativo == 'eventos'} ? 'ativo'"
                       th:attr="aria-current=${ativo == 'eventos'} ? 'page' : null">Eventos</a>
                    <a th:href="@{/eventos/comparativo}">Comparativo de eventos</a>
                    <a th:href="@{/despesas}" th:classappend="${ativo == 'despesas'} ? 'ativo'"
                       th:attr="aria-current=${ativo == 'despesas'} ? 'page' : null">Despesas</a>
                    <a th:href="@{/taxas}" th:classappend="${ativo == 'taxas'} ? 'ativo'"
                       th:attr="aria-current=${ativo == 'taxas'} ? 'page' : null">Taxas</a>
                </div>
            </details>
            <form class="form-sair" method="post" th:action="@{/logout}">
                <button type="submit" class="sair">
                    <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Sair
                </button>
            </form>
        </div>
    </div>
</nav>

<button th:fragment="tema" type="button" class="botao-tema" onclick="alternarTema()"
        aria-label="Alternar modo claro e escuro" title="Modo claro / escuro">
    <svg class="icone-lua" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icone-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div th:fragment="avisos">
    <div th:if="${sucesso}" class="aviso aviso-sucesso" role="status">
        <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
        <span th:text="${sucesso}">Venda registrada.</span>
    </div>
    <div th:if="${erro}" class="aviso aviso-erro" role="alert">
        <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
        <span th:text="${erro}">Algo deu errado.</span>
    </div>
</div>

</body>
</html>
