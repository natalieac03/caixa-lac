# Desenvolvimento local: banco em ARQUIVO (persiste entre reinicializações).
# Os dados ficam na pasta ./dados/ do projeto.
spring.datasource.url=jdbc:h2:file:./dados/caixa
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 em http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./dados/caixa)
spring.h2.console.enabled=true

# Senha local: exporte APP_SENHA ou copie senha-local.properties.exemplo para
# senha-local.properties (fora do git). O arquivo e opcional.
spring.config.import=optional:file:./senha-local.properties
server.address=127.0.0.1

spring.thymeleaf.cache=false
